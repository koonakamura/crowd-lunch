# Trigger CI after base branch change
name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install backend dependencies
      working-directory: ./api
      run: |
        pip install poetry
        poetry install
    
    - name: Install frontend dependencies
      working-directory: ./web
      run: npm install
    
    - name: Run backend tests
      working-directory: ./api
      env:
        TESTING: "true"
      run: poetry run pytest tests/
    
    - name: Run load testing (concurrency gate)
      working-directory: ./api
      env:
        TESTING: "true"
        # 負荷試験は専用の使い捨てDBで実行する。既定の crowdlunch.db を使うと
        # 直前の pytest 実行(app.main import 時の create_all)でテーブルが
        # できてしまい、後続のスキーマ作成が "already exists" で落ちる。
        DATABASE_URL: "sqlite:///./loadtest.db"
      run: |
        # Create a clean schema for the load test
        # （alembic の履歴は 001 と d61f7bd8daca が両方 menus を作るため base から
        #   upgrade head は通らない。本番は 8a3e1c2f9b21 に stamp 済みで運用中）
        rm -f loadtest.db
        poetry run python -c "
        from app import models  # noqa: F401  Base.metadata にモデルを登録するため必須
        from app.database import create_db_and_tables
        create_db_and_tables()
        print('Load test schema created')
        "
        
        # Create sample menu data for load testing
        poetry run python -c "
        from app.database import SessionLocal
        from app.crud import create_sample_menus
        db = SessionLocal()
        create_sample_menus(db)
        db.close()
        print('Sample menu data created for load testing')
        "
        
        # Start the FastAPI server in background
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 5
        
        # Create reports directory
        mkdir -p reports
        
        # Run Locust load test（20並列で注文ID採番の競合が起きないことを確認）
        poetry run locust -f scripts/locust_load_test.py --host=http://localhost:8000 \
          -u 20 -r 20 -t 60s --headless --html=reports/load_test_report.html \
          --csv=reports/load_test_stats
        
        # Kill the server
        kill $SERVER_PID

        # Evaluate the load-test gate.
        #
        # 判定は「失敗リクエストが0件か」だけにしている。この負荷試験の実質的な
        # 価値は 20 並列での注文ID生成（#MMDD000 の連番採番）が壊れないことの
        # 検証で、locust 側が order_id の形式を、DB 側が orders.order_id の
        # UNIQUE 制約を見ているため、採番の競合は failure として現れる。
        #
        # レイテンシは閾値にしない。共有ランナー + 単一プロセス uvicorn + SQLite
        # では同一コードでも実測が大きくぶれ、閾値を置くと flaky になるだけで
        # 退行検知には使えない（実測: median 17 → 100ms、p95 65 → 1300ms）。
        # 数値は下に出すので、傾向は run のログで追えるようにしておく。
        #
        # 旧実装は locust CSV の "Requests/s" 列を p95 として読んでおり
        # （実 p95 65ms を「10.03ms」と表示）、そもそも何も測っていなかった。
        poetry run python - <<'PYGATE'
        import csv, sys

        with open('reports/load_test_stats_stats.csv') as f:
            rows = [r for r in csv.DictReader(f) if r['Name'] == 'Aggregated']
        agg = rows[-1]

        requests = int(agg['Request Count'])
        fails = int(agg['Failure Count'])
        print(f'requests={requests} failures={fails} median={agg["50%"]}ms '
              f'p90={agg["90%"]}ms p95={agg["95%"]}ms p99={agg["99%"]}ms '
              f'max={float(agg["Max Response Time"]):.0f}ms')

        if requests == 0:
            print('LOAD TEST GATE FAILED: no requests were made')
            sys.exit(1)
        if fails > 0:
            print(f'LOAD TEST GATE FAILED: {fails}/{requests} requests failed')
            sys.exit(1)
        print(f'LOAD TEST GATE PASSED: {requests} requests, 0 failures')
        PYGATE
    
    - name: Upload load test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: load-test-reports
        path: api/reports/
    
    - name: Run frontend linting
      working-directory: ./web
      run: npm run lint
    
    - name: Build frontend
      working-directory: ./web
      env:
        VITE_API_BASE_URL: https://crowd-lunch.fly.dev
      run: npm run build

# フロントエンドのデプロイは Netlify 自身の Git 連携（main push でビルド）が
# 担っている。ここに GitHub Actions 経由の Netlify デプロイジョブがあったが、
# 同じコミットを二重にビルドするだけで NETLIFY_AUTH_TOKEN も失効していたため削除した。
# 復活させる場合は Netlify の Personal Access Token を再発行し、
# Netlify 側の自動ビルドを止めてから入れること（経路は1つに保つ）。
